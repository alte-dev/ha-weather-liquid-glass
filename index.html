<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glass Weather Card - Preview & Testbed</title>
  <style>
    body {
      margin: 0;
      padding: 30px 16px;
      background: #0b1120;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .preview-wrapper {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .preview-wrapper weather-liquid-glass-card {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }
    .controls-panel {
      width: 100%;
      max-width: 440px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 16px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box;
    }
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .controls-row select, .controls-row button {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .controls-row select option {
      background: #1e293b;
      color: #fff;
    }
    .controls-row button:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .highlight-label {
      color: #67e8f9;
    }
  </style>
</head>
<body>
  <div class="controls-panel">
    <div class="controls-row">
      <label><strong>Theme / Condition:</strong></label>
      <select id="condition-picker">
        <option value="sunny">Sunny (Güneşli)</option>
        <option value="partlycloudy">Partly Cloudy (Parçalı Bulutlu)</option>
        <option value="cloudy">Cloudy (Bulutlu)</option>
        <option value="rainy">Rainy (Yağmurlu)</option>
        <option value="snowy">Snowy (Karlı)</option>
        <option value="thunderstorm">Thunderstorm (Gök Gürültülü)</option>
        <option value="fog">Fog (Sisli)</option>
        <option value="windy">Windy (Rüzgarlı)</option>
        <option value="clear-night">Clear Night (Açık Gece)</option>
      </select>
    </div>

    <div class="controls-row">
      <label class="highlight-label"><strong>Day / Night (Zaman):</strong></label>
      <select id="daynight-picker">
        <option value="auto">Auto (Condition Based)</option>
        <option value="night">🌙 Night (Gece Modu)</option>
        <option value="day">☀️ Day (Gündüz Modu)</option>
      </select>
    </div>

    <div class="controls-row">
      <label class="highlight-label"><strong>Moon Phase (Ay Evresi):</strong></label>
      <select id="moon-picker">
        <option value="full_moon">🌕 Full Moon (Dolunay)</option>
        <option value="waxing_crescent">🌒 Waxing Crescent (Hilal - Büyüyen)</option>
        <option value="first_quarter">🌓 First Quarter (İlk Dördün)</option>
        <option value="waxing_gibbous">🌔 Waxing Gibbous (Büyüyen Şişkin)</option>
        <option value="waning_gibbous">🌖 Waning Gibbous (Küçülen Şişkin)</option>
        <option value="last_quarter">🌗 Last Quarter (Son Dördün)</option>
        <option value="waning_crescent">🌘 Waning Crescent (Hilal - Küçülen)</option>
        <option value="new_moon">🌑 New Moon (Yeni Ay)</option>
      </select>
    </div>

    <div class="controls-row">
      <label><strong>Language / Dil:</strong></label>
      <select id="lang-picker">
        <option value="tr">Türkçe</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
      </select>
    </div>

    <div class="controls-row">
      <label class="highlight-label"><strong>Forecast Days (Tahmin Günü):</strong></label>
      <select id="days-picker">
        <option value="10">10 Days (10 Gün - Default)</option>
        <option value="7">7 Days (7 Gün)</option>
        <option value="5">5 Days (5 Gün)</option>
      </select>
    </div>

    <div class="controls-row">
      <label><strong>Layout Shape:</strong></label>
      <select id="layout-picker">
        <option value="default">Default (Full Phone)</option>
        <option value="square-scroll">Square (Scrollable 1:1)</option>
        <option value="square-fit">Square (Fitted 1:1 Widget)</option>
        <option value="compact">Compact (Horizontal)</option>
        <option value="mini">Mini (Minimal Widget)</option>
      </select>
    </div>

    <div class="controls-row">
      <label><strong>View Mode:</strong></label>
      <div style="display: flex; gap: 6px;">
        <button id="btn-condition">⛅ Condition</button>
        <button id="btn-rain">💧 Rain</button>
        <button id="btn-wind">💨 Wind</button>
      </div>
    </div>
  </div>

  <div class="preview-wrapper" id="preview-wrapper">
    <weather-liquid-glass-card id="test-card"></weather-liquid-glass-card>
  </div>

  <script type="module" src="/src/ios27-weather-card.ts"></script>
  <script>
    const mockHourly = [
      { datetime: new Date(Date.now() + 3600000 * 1).toISOString(), condition: 'partlycloudy', temperature: 23, precipitation: 0, precipitation_probability: 0, wind_speed: 8 },
      { datetime: new Date(Date.now() + 3600000 * 2).toISOString(), condition: 'rainy', temperature: 22, precipitation: 0.4, precipitation_probability: 35, wind_speed: 7 },
      { datetime: new Date(Date.now() + 3600000 * 3).toISOString(), condition: 'rainy', temperature: 21, precipitation: 0.8, precipitation_probability: 45, wind_speed: 5 },
      { datetime: new Date(Date.now() + 3600000 * 4).toISOString(), condition: 'cloudy', temperature: 20, precipitation: 0, precipitation_probability: 10, wind_speed: 6 },
      { datetime: new Date(Date.now() + 3600000 * 5).toISOString(), condition: 'sunny', temperature: 19, precipitation: 0, precipitation_probability: 0, wind_speed: 9 },
      { datetime: new Date(Date.now() + 3600000 * 6).toISOString(), condition: 'sunny', temperature: 18, precipitation: 0, precipitation_probability: 0, wind_speed: 8 },
      { datetime: new Date(Date.now() + 3600000 * 7).toISOString(), condition: 'clear-night', temperature: 17, precipitation: 0, precipitation_probability: 0, wind_speed: 7 },
      { datetime: new Date(Date.now() + 3600000 * 8).toISOString(), condition: 'clear-night', temperature: 16, precipitation: 0, precipitation_probability: 0, wind_speed: 6 },
      { datetime: new Date(Date.now() + 3600000 * 9).toISOString(), condition: 'clear-night', temperature: 15, precipitation: 0, precipitation_probability: 0, wind_speed: 5 },
      { datetime: new Date(Date.now() + 3600000 * 10).toISOString(), condition: 'clear-night', temperature: 14, precipitation: 0, precipitation_probability: 0, wind_speed: 4 },
      { datetime: new Date(Date.now() + 3600000 * 11).toISOString(), condition: 'sunny', temperature: 15, precipitation: 0, precipitation_probability: 0, wind_speed: 6 },
      { datetime: new Date(Date.now() + 3600000 * 12).toISOString(), condition: 'sunny', temperature: 17, precipitation: 0, precipitation_probability: 0, wind_speed: 7 },
    ];

    const mockDaily = [
      { datetime: new Date().toISOString(), condition: 'sunny', temperature: 27, templow: 17, precipitation_probability: 0 },
      { datetime: new Date(Date.now() + 86400000 * 1).toISOString(), condition: 'partlycloudy', temperature: 26, templow: 16, precipitation_probability: 10 },
      { datetime: new Date(Date.now() + 86400000 * 2).toISOString(), condition: 'rainy', temperature: 22, templow: 14, precipitation_probability: 65 },
      { datetime: new Date(Date.now() + 86400000 * 3).toISOString(), condition: 'cloudy', temperature: 24, templow: 15, precipitation_probability: 20 },
      { datetime: new Date(Date.now() + 86400000 * 4).toISOString(), condition: 'sunny', temperature: 28, templow: 18, precipitation_probability: 0 },
      { datetime: new Date(Date.now() + 86400000 * 5).toISOString(), condition: 'sunny', temperature: 29, templow: 19, precipitation_probability: 0 },
      { datetime: new Date(Date.now() + 86400000 * 6).toISOString(), condition: 'partlycloudy', temperature: 27, templow: 17, precipitation_probability: 15 },
      { datetime: new Date(Date.now() + 86400000 * 7).toISOString(), condition: 'rainy', temperature: 21, templow: 13, precipitation_probability: 80 },
      { datetime: new Date(Date.now() + 86400000 * 8).toISOString(), condition: 'cloudy', temperature: 23, templow: 15, precipitation_probability: 25 },
      { datetime: new Date(Date.now() + 86400000 * 9).toISOString(), condition: 'sunny', temperature: 26, templow: 16, precipitation_probability: 0 }
    ];

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('hideControls') === 'true') {
      const panel = document.querySelector('.controls-panel');
      if (panel) panel.style.display = 'none';
    }

    let currentCondition = urlParams.get('condition') || 'sunny';
    let currentDayNight = 'auto';
    let currentMoonPhase = 'full_moon';
    let currentLang = urlParams.get('lang') || 'tr';
    let currentDailyCount = 10;
    let currentLayout = urlParams.get('layout') || 'default';
    let currentView = urlParams.get('view') || 'condition';

    function createMockHass(condition = 'sunny', isNight = false, lang = 'tr', moonPhase = 'full_moon') {
      let temp = 20;
      let templow = 14;
      let temphigh = 22;

      if (condition === 'snowy' || condition.includes('snow')) {
        temp = -2;
        templow = -6;
        temphigh = 1;
      } else if (condition === 'sunny' || (condition.includes('clear') && !isNight)) {
        temp = 27;
        templow = 17;
        temphigh = 29;
      } else if (condition === 'partlycloudy' || condition.includes('partly')) {
        temp = 21;
        templow = 13;
        temphigh = 23;
      } else if (condition === 'rainy' || condition.includes('rain')) {
        temp = 16;
        templow = 12;
        temphigh = 18;
      } else if (condition === 'thunderstorm') {
        temp = 19;
        templow = 14;
        temphigh = 21;
      } else if (condition === 'fog') {
        temp = 11;
        templow = 8;
        temphigh = 14;
      } else if (condition === 'windy' || condition.includes('wind')) {
        temp = 18;
        templow = 12;
        temphigh = 20;
      } else if (isNight) {
        temp = 14;
        templow = 9;
        temphigh = 18;
      }

      const themedHourly = mockHourly.map((h, i) => ({
        ...h,
        condition: isNight ? (i % 2 === 0 ? 'clear-night' : 'cloudy') : condition,
        temperature: temp - Math.round(i * 0.7),
        precipitation_probability: condition.includes('rain') || condition === 'thunderstorm' ? 70 : condition === 'snowy' ? 60 : 0,
        precipitation: condition.includes('rain') ? 2.4 : condition === 'snowy' ? 1.5 : 0
      }));

      const themedDaily = mockDaily.map((d, i) => ({
        ...d,
        condition: i === 0 ? (isNight ? 'clear-night' : condition) : d.condition,
        temperature: temphigh - (i % 3),
        templow: templow - (i % 2),
      }));

      return {
        states: {
          'weather.home': {
            entity_id: 'weather.home',
            state: isNight && condition === 'sunny' ? 'clear-night' : condition,
            attributes: {
              friendly_name: lang === 'en' ? 'Cupertino' : 'Kırklareli',
              temperature: temp,
              temperature_unit: '°C',
              wind_speed_unit: 'km/h',
              precipitation_unit: 'mm',
              humidity: 65,
              pressure: 1015,
              visibility: 10,
              uv_index: isNight ? 0 : 5,
              wind_bearing: 180,
              wind_speed: 12,
              apparent_temperature: temp + 1,
              dew_point: 13
            }
          },
          'sun.sun': {
            state: isNight ? 'below_horizon' : 'above_horizon',
            attributes: {
              latitude: 41.735,
              longitude: 27.225,
              next_setting: new Date(Date.now() + 3600000 * 2.2).toISOString(),
              next_rising: new Date(Date.now() + 3600000 * 14.5).toISOString(),
            }
          },
          'sensor.moon': {
            entity_id: 'sensor.moon',
            state: moonPhase,
            attributes: {
              friendly_name: 'Moon Phase',
              icon: 'mdi:moon-' + moonPhase.replace(/_/g, '-')
            }
          }
        },
        connection: {
          subscribeMessage: (cb, msg) => {
            setTimeout(() => {
              if (msg.forecast_type === 'hourly') cb({ forecast: themedHourly });
              if (msg.forecast_type === 'daily') cb({ forecast: themedDaily });
            }, 50);
            return () => {};
          }
        },
        locale: { language: lang },
        language: lang,
        config: {
          latitude: 41.735,
          longitude: 27.225,
          location_name: lang === 'en' ? 'Cupertino' : 'Kırklareli',
          unit_system: { length: 'km', temperature: '°C' }
        }
      };
    }
    window.createMockHass = createMockHass;

    Promise.all([
      customElements.whenDefined('weather-liquid-glass-card'),
      customElements.whenDefined('ios27-weather-card')
    ]).then(() => {
      const card = document.getElementById('test-card');

      function updateCard() {
        card.setConfig({
          type: 'custom:weather-liquid-glass-card',
          entity: 'weather.home',
          name: currentLang === 'en' ? 'Cupertino' : 'Kırklareli',
          default_view: currentView,
          card_layout: currentLayout,
          daily_count: currentDailyCount,
          locale: currentLang,
          show_highlights: true,
          show_bottom_bar: true,
          show_details: true,
          animated_background: true,
        });

        const isNight = currentDayNight === 'night'
          ? true
          : currentDayNight === 'day'
          ? false
          : (currentCondition === 'clear-night' || currentCondition.includes('night'));

        card.hass = createMockHass(currentCondition, isNight, currentLang, currentMoonPhase);

        const wrapper = document.getElementById('preview-wrapper');
        wrapper.className = 'preview-wrapper layout-' + currentLayout;
        if (currentLayout === 'square-scroll' || currentLayout === 'square-fit') {
          wrapper.style.maxWidth = '360px';
          wrapper.style.width = '360px';
          wrapper.style.height = '360px';
        } else if (currentLayout === 'compact') {
          wrapper.style.maxWidth = '460px';
          wrapper.style.width = '460px';
          wrapper.style.height = 'auto';
        } else if (currentLayout === 'mini') {
          wrapper.style.maxWidth = '380px';
          wrapper.style.width = '380px';
          wrapper.style.height = 'auto';
        } else {
          wrapper.style.maxWidth = '400px';
          wrapper.style.width = '400px';
          wrapper.style.height = 'auto';
        }
      }

      updateCard();

      document.getElementById('condition-picker').addEventListener('change', (e) => {
        currentCondition = e.target.value;
        updateCard();
      });

      document.getElementById('daynight-picker').addEventListener('change', (e) => {
        currentDayNight = e.target.value;
        updateCard();
      });

      document.getElementById('moon-picker').addEventListener('change', (e) => {
        currentMoonPhase = e.target.value;
        updateCard();
      });

      document.getElementById('lang-picker').addEventListener('change', (e) => {
        currentLang = e.target.value;
        updateCard();
      });

      document.getElementById('days-picker').addEventListener('change', (e) => {
        currentDailyCount = parseInt(e.target.value, 10);
        updateCard();
      });

      document.getElementById('layout-picker').addEventListener('change', (e) => {
        currentLayout = e.target.value;
        updateCard();
      });

      function switchMode(view) {
        const forecastCard = card.shadowRoot?.querySelector('ios27-forecast-card');
        if (forecastCard) {
          forecastCard.activeMode = view;
          forecastCard.requestUpdate();
        }
      }

      document.getElementById('btn-condition').addEventListener('click', () => switchMode('condition'));
      document.getElementById('btn-rain').addEventListener('click', () => switchMode('precipitation'));
      document.getElementById('btn-wind').addEventListener('click', () => switchMode('wind'));
    });
  </script>
</body>
</html>
